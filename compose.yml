version: '3'

services:
  api:
    build: ./EzMap.Api/
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__myDb1=Server=db;Database=EzMap;User Id=sa;Password=Jko3va-D9821jhsvGD; Trust Server Certificate=True;
      - ELK__URL=http://es:9200
    depends_on:
      - db
      - seq
      - es

  db:
    image: mcr.microsoft.com/mssql/server:2017-latest
    environment:
      SA_PASSWORD: "Jko3va-D9821jhsvGD"
      ACCEPT_EULA: "Y"

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: "Y"
      
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: 'single-node'
      xpack.security.enabled: 'false'
    ports:
      - "5001:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      ELASTICSEARCH_HOSTS: http://es:9200
    ports:
      - "5002:5601"
    depends_on:
      - es
  
volumes:
  es_data:
      
      
