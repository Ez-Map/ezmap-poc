version: '3'

services:
  api:
    build: ./EzMap.Api/
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__myDb1=Server=db;Database=EzMap;User Id=sa;Password=; Trust Server Certificate=True;
    depends_on:
      - db
      - seq

  db:
    image: mcr.microsoft.com/mssql/server:2017-latest
    environment:
      SA_PASSWORD: ""
      ACCEPT_EULA: "Y"

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: "Y"
